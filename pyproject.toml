[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmrmix"
version = "0.1.0"
description = "Talk to public Monero nodes and broadcast transactions through the Nym mixnet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "apeir" }]
dependencies = []
keywords = ["monero", "nym", "mixnet", "privacy", "monerod", "wallet"]

[project.scripts]
xmrmix = "xmrmix.cli:main"

[project.urls]
Homepage = "https://github.com/apeirs/xmrmix"

[tool.setuptools]
packages = ["xmrmix"]
